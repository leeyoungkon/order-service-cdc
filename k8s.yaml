apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-cdc
  labels:
    app: order-service-cdc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service-cdc
  template:
    metadata:
      labels:
        app: order-service-cdc
    spec:
      containers:
        - name: order-service-cdc
          image: yklee2002/order-service-cdc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/orderdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root1234
          
---
apiVersion: v1
kind: Service
metadata:
  name: order-service-cdc
  labels:
    app: order-service-cdc
spec:
  type: NodePort
  selector:
    app: order-service-cdc
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
